<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIXCLO Admin — Edit Home</title>
<style>body{margin:0;background:#090909;color:#fff;font-family:Arial}.wrap{max-width:900px;margin:auto;padding:30px}.card{background:#131313;border:1px solid #292929;padding:22px;margin:15px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;color:#999;font-size:11px;margin:12px 0 6px}input,textarea{width:100%;box-sizing:border-box;background:#080808;color:#fff;border:1px solid #333;padding:11px}button{margin-top:15px;padding:12px 18px;background:#e50914;color:#fff;border:0;font-weight:900}.preview{border:1px solid #333;padding:20px;background:#0b0b0b}.preview h1{font-size:48px;line-height:.9;margin:10px 0}.muted{color:#777;font-size:12px}.links a{color:#fff;margin-right:15px;font-size:12px}</style></head><body><div class="wrap"><h1>VIXCLO HOME EDITOR</h1><p class="muted">Change the home page text without touching code. The Custom Lab stays separate.</p><div class="card"><div class="row"><div><label>Hero badge</label><input id="badge"></div><div><label>Navigation CTA</label><input id="cta"></div></div><label>Hero title (HTML allowed, e.g. DEFINE &lt;br&gt;YOUR &lt;em&gt;STYLE&lt;/em&gt;)</label><input id="title"><label>Hero description</label><textarea id="text" rows="4"></textarea><button id="save">SAVE CHANGES</button><button id="reset" style="background:#333;margin-left:7px">RESET</button></div><div class="card preview"><div id="pbadge" style="color:#e50914"></div><h1 id="ptitle"></h1><p id="ptext" class="muted"></p><div class="links"><a href="index.html">Open Home ↗</a><a href="custom.html">Open Custom Lab ↗</a></div></div></div><script>
const d={badge:"VIXCLO CUSTOM LAB",cta:"CREATE YOUR T-SHIRT ↗",title:"DEFINE<br>YOUR <em>STYLE</em>",text:"Choose a design, place it exactly where you want, make it bigger or smaller, and preview your T-shirt before you order."};
const $=x=>document.getElementById(x);let c=JSON.parse(localStorage.getItem("vixcloSiteConfig")||"null")||d;
function render(){$("badge").value=c.badge;$("cta").value=c.cta;$("title").value=c.title;$("text").value=c.text;$("pbadge").textContent=c.badge;$("ptitle").innerHTML=c.title;$("ptext").textContent=c.text}
$("save").onclick=()=>{c={badge:$("badge").value,cta:$("cta").value,title:$("title").value,text:$("text").value};localStorage.setItem("vixcloSiteConfig",JSON.stringify(c));render();alert("Saved! Open index.html to see the changes.")};$("reset").onclick=()=>{localStorage.removeItem("vixcloSiteConfig");c=d;render()};render();
</script></body></html>
